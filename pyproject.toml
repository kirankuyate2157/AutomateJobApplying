[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.1.0"
description = "Targeted, auditable LinkedIn job-application and hiring-post outreach automation"
requires-python = ">=3.10"
# WHY minimal core deps: everything that touches a browser, web UI or LLM SDK
# is an optional extra, so the core (storage, scoring, answering) stays light
# and easy to test.
dependencies = ["PyYAML>=6.0", "requests>=2.31", "openpyxl>=3.1"]

[project.optional-dependencies]
browser = ["selenium>=4.20"]      # Selenium Manager downloads chromedriver itself
ui = ["flask>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
jobpilot = "jobpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobpilot = ["resources/*"]

# ------------------------------------------------------------------ ruff (lint + format)
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]
exclude = [".venv", "build", "dist", "*.egg-info", "__pycache__", ".git"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "C4", "PLE", "PERF", "RET", "RUF", "TRY"]
ignore = ["E501", "B008"]
unfixable = ["F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["jobpilot"]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ------------------------------------------------------------------ mypy (static types)
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
strict_optional = true
ignore_missing_imports = true
exclude = [
    ".venv", "build", "dist", "*.egg-info", "__pycache__", ".git",
    "src/jobpilot/browser/__pycache__",
]
